<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Ambient Glows -->
  <circle cx="200" cy="150" r="160" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="400" r="220" fill="#0ea5e9" opacity="0.12" filter="url(#glow)"/>

  <!-- Top Navbar -->
  <g transform="translate(40, 30)">
    <rect width="1120" height="64" rx="16" fill="#131c31" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Logo & Brand -->
    <rect x="18" y="14" width="36" height="36" rx="10" fill="url(#accentGrad)"/>
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
    <text x="66" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff">SkyCast</text>
    
    <rect x="160" y="20" width="170" height="24" rx="12" fill="#1e293b"/>
    <text x="245" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">By Umar Mukthar</text>
    
    <!-- Search Bar -->
    <rect x="360" y="14" width="400" height="36" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="385" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">🔍  Search city, state or ZIP code...</text>

    <!-- Location & Status -->
    <rect x="790" y="16" width="160" height="32" rx="10" fill="#1e293b"/>
    <text x="870" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">📍 San Francisco, US</text>

    <!-- Creator Tag Button -->
    <rect x="970" y="16" width="134" height="32" rx="10" fill="url(#accentGrad)"/>
    <text x="1037" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">@UMARMUKTHAR03</text>
  </g>

  <!-- Left Main Weather Card -->
  <g transform="translate(40, 114)">
    <rect width="360" height="420" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <text x="30" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#818cf8">LIVE WEATHER RADAR</text>
    <text x="30" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">San Francisco</text>
    <text x="30" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Monday, Real-time Analysis</text>

    <!-- Weather Graphic -->
    <g transform="translate(240, 130)">
      <circle cx="30" cy="30" r="34" fill="url(#sunGrad)"/>
      <path d="M-5,40 C-5,25 15,25 25,30 C30,18 55,18 60,30 C75,30 80,45 70,55 C65,58 0,58 -5,40 Z" fill="#e2e8f0" opacity="0.92"/>
    </g>

    <!-- Huge Temp -->
    <text x="30" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" fill="#ffffff">24°</text>
    <text x="150" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#38bdf8">C</text>
    <text x="30" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">Sunny &amp; Clear Sky</text>
    <text x="30" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Feels like 23° • High: 26° Low: 18°</text>

    <!-- Parameter Badges -->
    <g transform="translate(30, 270)">
      <rect width="140" height="58" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">💧 Humidity</text>
      <text x="16" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">58%</text>

      <rect x="160" y="0" width="140" height="58" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="176" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">💨 Wind Speed</text>
      <text x="176" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">4.2 m/s</text>

      <rect x="0" y="68" width="140" height="58" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">🌅 Sunrise</text>
      <text x="16" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">06:24 AM</text>

      <rect x="160" y="68" width="140" height="58" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="176" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">🌇 Sunset</text>
      <text x="176" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">06:48 PM</text>
    </g>
  </g>

  <!-- Right Dashboard Widgets -->
  <!-- Hourly Forecast Banner -->
  <g transform="translate(420, 114)">
    <rect width="740" height="195" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">⏱️  HOURLY TEMPERATURE CURVE (NEXT 24H)</text>

    <!-- Hourly Graph Line -->
    <path d="M 40 140 Q 120 70 200 90 T 360 80 T 520 120 T 680 135" fill="none" stroke="#6366f1" stroke-width="4"/>
    <path d="M 40 140 Q 120 70 200 90 T 360 80 T 520 120 T 680 135 L 680 170 L 40 170 Z" fill="url(#chartGrad)"/>

    <!-- Hourly Data Points -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
      <text x="60" y="70" font-weight="700" fill="#f8fafc">24°</text>
      <text x="60" y="165">Now</text>

      <text x="160" y="65" font-weight="700" fill="#f8fafc">26°</text>
      <text x="160" y="165">14:00</text>

      <text x="260" y="75" font-weight="700" fill="#f8fafc">25°</text>
      <text x="260" y="165">17:00</text>

      <text x="360" y="70" font-weight="700" fill="#f8fafc">22°</text>
      <text x="360" y="165">20:00</text>

      <text x="480" y="95" font-weight="700" fill="#f8fafc">20°</text>
      <text x="480" y="165">23:00</text>

      <text x="600" y="115" font-weight="700" fill="#f8fafc">18°</text>
      <text x="600" y="165">02:00</text>
    </g>
  </g>

  <!-- 3-Metrics Grid (AQI, Rain probability, UV Index) -->
  <g transform="translate(420, 325)">
    <!-- AQI -->
    <rect width="230" height="100" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">🍃 AIR QUALITY INDEX</text>
    <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#10b981">AQI 32</text>
    <text x="125" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#10b981">• Healthy</text>
    <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">PM2.5: 6.8 µg/m³</text>

    <!-- Rain Probability -->
    <g transform="translate(255, 0)">
      <rect width="230" height="100" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">🌧️ PRECIPITATION</text>
      <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#38bdf8">8%</text>
      <text x="75" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">chance of rain</text>
      <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Expected: 0.0 mm</text>
    </g>

    <!-- UV Index -->
    <g transform="translate(510, 0)">
      <rect width="230" height="100" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">☀️ UV RADAR INDEX</text>
      <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#fbbf24">3.4</text>
      <text x="75" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">• Moderate</text>
      <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Sun protection advised</text>
    </g>
  </g>

  <!-- 7-Day Forecast Strip -->
  <g transform="translate(420, 440)">
    <rect width="740" height="94" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(20, 16)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <!-- Day 1 -->
      <g transform="translate(10, 0)">
        <text x="30" y="16" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Mon</text>
        <text x="30" y="36" font-size="16" text-anchor="middle">☀️</text>
        <text x="30" y="56" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">24° <tspan fill="#64748b" font-weight="400">18°</tspan></text>
      </g>
      <!-- Day 2 -->
      <g transform="translate(110, 0)">
        <text x="30" y="16" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Tue</text>
        <text x="30" y="36" font-size="16" text-anchor="middle">⛅</text>
        <text x="30" y="56" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">23° <tspan fill="#64748b" font-weight="400">17°</tspan></text>
      </g>
      <!-- Day 3 -->
      <g transform="translate(210, 0)">
        <text x="30" y="16" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Wed</text>
        <text x="30" y="36" font-size="16" text-anchor="middle">🌧️</text>
        <text x="30" y="56" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">20° <tspan fill="#64748b" font-weight="400">15°</tspan></text>
      </g>
      <!-- Day 4 -->
      <g transform="translate(310, 0)">
        <text x="30" y="16" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Thu</text>
        <text x="30" y="36" font-size="16" text-anchor="middle">⛅</text>
        <text x="30" y="56" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">22° <tspan fill="#64748b" font-weight="400">16°</tspan></text>
      </g>
      <!-- Day 5 -->
      <g transform="translate(410, 0)">
        <text x="30" y="16" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Fri</text>
        <text x="30" y="36" font-size="16" text-anchor="middle">☀️</text>
        <text x="30" y="56" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">25° <tspan fill="#64748b" font-weight="400">17°</tspan></text>
      </g>
      <!-- Day 6 -->
      <g transform="translate(510, 0)">
        <text x="30" y="16" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Sat</text>
        <text x="30" y="36" font-size="16" text-anchor="middle">☀️</text>
        <text x="30" y="56" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">26° <tspan fill="#64748b" font-weight="400">18°</tspan></text>
      </g>
      <!-- Day 7 -->
      <g transform="translate(610, 0)">
        <text x="30" y="16" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Sun</text>
        <text x="30" y="36" font-size="16" text-anchor="middle">⛅</text>
        <text x="30" y="56" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">24° <tspan fill="#64748b" font-weight="400">17°</tspan></text>
      </g>
    </g>
  </g>

  <!-- Bottom Brand Footer -->
  <g transform="translate(40, 560)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="#1e293b" stroke-width="1.5"/>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      SkyCast Weather Intelligence Platform • Designed &amp; Developed by <tspan fill="#38bdf8" font-weight="700">UMAR MUKTHAR</tspan>
    </text>
    <text x="1120" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6366f1" text-anchor="end">
      https://github.com/UMARMUKTHAR03/weather-forecast-app
    </text>
  </g>
</svg>
